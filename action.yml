name: 'Quelor admit'
description: 'Admit-before-start gate: check a rate-limit budget before an API-heavy step runs, and defer instead of going red.'
author: 'ARAMAI'
branding:
  icon: shield
  color: blue
inputs:
  resource:
    description: 'Resource to check (github_api, github_search, github_graphql).'
    required: false
    default: 'github_api'
  need:
    description: 'Units of the resource the next step expects to spend.'
    required: true
  optional:
    description: 'If "true", an insufficient budget yields verdict "defer" (exit 42) instead of "degraded".'
    required: false
    default: 'false'
  token:
    description: 'Token used to read GitHub /rate_limit.'
    required: false
    default: ${{ github.token }}
  version:
    description: 'Quelor release tag to install, such as v0.1.1. The archive is checked against the release checksums and the step fails if they do not match. "latest" is not accepted.'
    required: false
    default: 'v0.1.1'
  fail-on-defer:
    description: 'Fail the step when the verdict is not admit.'
    required: false
    default: 'false'
outputs:
  verdict:
    description: 'admit, defer or degraded.'
    value: ${{ steps.admit.outputs.verdict }}
  remaining:
    description: 'Remaining units reported by the resource (empty when unknown).'
    value: ${{ steps.admit.outputs.remaining }}
runs:
  using: 'composite'
  steps:
    - name: Install quelor
      shell: bash
      env:
        QUELOR_VERSION: ${{ inputs.version }}
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/install-action.sh"
    - name: Admit
      id: admit
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        Q_RESOURCE: ${{ inputs.resource }}
        Q_NEED: ${{ inputs.need }}
        Q_OPTIONAL: ${{ inputs.optional }}
        Q_FAIL: ${{ inputs.fail-on-defer }}
      run: |
        args=(admit --resource "$Q_RESOURCE" --need "$Q_NEED")
        [ "$Q_OPTIONAL" = "true" ] && args+=(--optional)
        set +e
        quelor "${args[@]}"
        code=$?
        set -e
        case "$code" in
          0)  ;;
          42|43) if [ "$Q_FAIL" = "true" ]; then exit "$code"; fi ;;
          *)  exit "$code" ;;
        esac
